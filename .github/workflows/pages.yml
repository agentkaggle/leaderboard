name: Refresh and deploy leaderboard

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.164.0"
  HUGO_SHA256: "d9c8b17285ea4ec004d9f814273ea910f2051ce02c284993fd1f91ba455ae50d"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      artifact_id: ${{ steps.pages-artifact.outputs.artifact_id }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run python -m unittest discover -v

      - name: Run frontend tests
        run: node --test tests/app.test.cjs

      - name: Generate sanitized leaderboard data
        env:
          KAGGLE_TEAMS: ${{ secrets.KAGGLE_TEAMS }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_API_TOKENS: ${{ secrets.KAGGLE_API_TOKENS }}
          KAGGLE_LEGACY_CREDENTIALS: ${{ secrets.KAGGLE_LEGACY_CREDENTIALS }}
          KAGGLE_AUTO_DISCOVER_TEAMS: "true"
          KAGGLE_SCAN_WORKERS: "2"
          KAGGLE_REQUEST_INTERVAL_SECONDS: "2"
        run: uv run python -m agentkaggle_leaderboard --output data/leaderboard.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install pinned Hugo
        shell: bash
        run: |
          set -euo pipefail
          HUGO_ARCHIVE="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${HUGO_ARCHIVE}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${HUGO_ARCHIVE}"
          echo "${HUGO_SHA256}  ${RUNNER_TEMP}/${HUGO_ARCHIVE}" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/${HUGO_ARCHIVE}" --directory "${RUNNER_TEMP}" hugo
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Build static site
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/" --destination public

      - name: Check public artifact safety
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_API_TOKENS: ${{ secrets.KAGGLE_API_TOKENS }}
          KAGGLE_LEGACY_CREDENTIALS: ${{ secrets.KAGGLE_LEGACY_CREDENTIALS }}
        run: uv run python scripts/check_public_artifact.py public data/leaderboard.json

      - name: Upload Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 90
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
          PAGES_DEPLOYMENT_TIMEOUT_MS: "2100000"
          PAGES_LOCK_TIMEOUT_MS: "2700000"
        with:
          github-token: ${{ github.token }}
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID)
            const timeoutMs = Number(process.env.PAGES_DEPLOYMENT_TIMEOUT_MS)
            const lockTimeoutMs = Number(process.env.PAGES_LOCK_TIMEOUT_MS)
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('Pages artifact ID is missing or invalid.')
            }
            if (!Number.isSafeInteger(timeoutMs) || timeoutMs <= 0) {
              throw new Error('Pages deployment timeout is invalid.')
            }
            if (!Number.isSafeInteger(lockTimeoutMs) || lockTimeoutMs <= 0) {
              throw new Error('Pages deployment lock timeout is invalid.')
            }

            const idToken = await core.getIDToken()
            const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds))
            const lockDeadline = Date.now() + lockTimeoutMs
            const cancelledBlockers = new Set()
            let deployment

            while (!deployment) {
              try {
                const response = await github.request(
                  'POST /repos/{owner}/{repo}/pages/deployments',
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifactId,
                    pages_build_version: context.sha,
                    oidc_token: idToken,
                  },
                )
                deployment = response.data
              } catch (error) {
                const message = error.response?.data?.message ?? error.message ?? ''
                const blocker = message.match(/Please cancel ([0-9a-f]{40}) first/i)?.[1]
                if (error.status !== 400 || !blocker) throw error
                if (Date.now() >= lockDeadline) {
                  throw new Error(`Pages deployment ${blocker} did not release its lock.`)
                }

                core.warning(`Waiting for blocking Pages deployment ${blocker}.`)
                if (!cancelledBlockers.has(blocker)) {
                  try {
                    await github.request(
                      'POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel',
                      {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        deployment_id: blocker,
                      },
                    )
                  } catch (cancelError) {
                    core.warning(
                      `Unable to cancel blocking deployment (${cancelError.status ?? 'unknown'}).`,
                    )
                  }
                  cancelledBlockers.add(blocker)
                }
                await sleep(15000)
              }
            }

            const deploymentId = deployment.id
              ?? deployment.status_url?.split('/').pop()
              ?? context.sha
            core.setOutput('page_url', deployment.page_url ?? '')
            core.info(`Created Pages deployment ${deploymentId}.`)

            const finalErrors = new Map([
              ['deployment_failed', 'Deployment failed.'],
              ['deployment_content_failed', 'Pages rejected the artifact content.'],
              ['deployment_cancelled', 'Deployment was cancelled.'],
              ['deployment_lost', 'Deployment stopped reporting status.'],
            ])
            const deadline = Date.now() + timeoutMs
            let requestErrors = 0

            while (Date.now() < deadline) {
              await sleep(5000)

              let status
              try {
                const response = await github.request(
                  'GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}',
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    deployment_id: deploymentId,
                  },
                )
                status = response.data.status
                requestErrors = 0
              } catch (error) {
                requestErrors += 1
                core.warning(`Pages status request failed (${error.status ?? 'unknown'}).`)
                if (requestErrors < 10) continue
                break
              }

              core.info(`Current Pages deployment status: ${status}`)
              if (status === 'succeed') return
              if (finalErrors.has(status)) {
                throw new Error(finalErrors.get(status))
              }
            }

            try {
              await github.request(
                'POST /repos/{owner}/{repo}/pages/deployments/{deployment_id}/cancel',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deploymentId,
                },
              )
            } catch (error) {
              core.warning(`Unable to cancel timed-out Pages deployment (${error.status ?? 'unknown'}).`)
            }
            throw new Error(
              requestErrors >= 10
                ? 'Too many Pages status request errors.'
                : `Pages deployment did not finish within ${timeoutMs} ms.`,
            )
